<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diana Saoutieva</title>
<meta name="description" content="Articles by Diana Saoutieva.">
<meta property="og:title" content="Diana Saoutieva">
<meta property="og:description" content="Gefascineerd door buitengewone mensen en ideeën, schrijf ik verhalen die onze blik kunnen verruimen.">
<meta property="og:image" content="https://dianasaoutieva.com/media/profiel.jpg">
<meta property="og:url" content="https://dianasaoutieva.com/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231c1916'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='16' fill='%23f1ece4' text-anchor='middle'%3EDS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: vaste donkere zijbalk links (identiteit + menu), rechts een raster met artikelkaartjes; op gsm schuift de zijbalk naar boven */
:root{
  --side:#1c1916; --side-fg:#f1ece4; --side-muted:#b3aa9d;
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b1d22; --muted:#5f6571; --line:#e2e5ea;
  --accent:#b8365a;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#141210; --side-fg:#f1ece4; --side-muted:#a69d90;
  --bg:#17191e; --surface:#1f2228; --fg:#eceef2; --muted:#a2a8b4; --line:#2e323a; --accent:#e0698c; color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#141210; --side-fg:#f1ece4; --side-muted:#a69d90;
  --bg:#17191e; --surface:#1f2228; --fg:#eceef2; --muted:#a2a8b4; --line:#2e323a; --accent:#e0698c; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:100vh}

/* zijbalk */
aside{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:28px;
  padding-block:56px;padding-left:40px;padding-right:44px;
  background-image:linear-gradient(180deg,rgba(20,17,14,.62),rgba(20,17,14,.82) 55%,rgba(20,17,14,.92)),
                   var(--bg-img,none);
  background-size:cover;background-position:center}
.photo[src=""]{visibility:hidden}
.photo{width:180px;aspect-ratio:1;max-width:100%;object-fit:cover;border-radius:2px;display:block;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.name{font-family:var(--display);font-weight:500;font-size:2.1rem;line-height:1.1;margin:0;text-wrap:balance}
.role{color:var(--side-muted);font-size:.9rem;margin:-18px 0 0;letter-spacing:.04em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:10px;margin-top:12px}
nav a{color:var(--side-fg);text-decoration:none;font-size:1.1rem;padding:2px 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current="page"]{border-bottom-color:var(--accent)}
nav a:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.socials{margin-top:auto;font-size:.85rem;color:var(--side-muted)}

/* hoofdgedeelte */
main{padding-block:48px;padding-left:max(16px,4vw);padding-right:max(16px,4vw,env(safe-area-inset-right,0px));min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:36px}
.toolbar input,.toolbar select{font:inherit;font-size:.95rem;padding:10px 14px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);border-radius:4px}
.toolbar input{flex:1 1 260px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 28px}
.card{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:center;align-items:center}
.card .thumb{align-self:stretch}
.thumb{aspect-ratio:1;width:100%;max-width:100%;border-radius:2px;overflow:hidden;position:relative}
.thumb span{position:absolute;left:10px;bottom:10px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:2px}
.meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card h3{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.15;margin:0;text-wrap:balance}
.card:hover h3{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
.card p{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted)}

/* pagina's */
.page{max-width:680px}
.page h2{font-family:var(--display);font-weight:500;font-size:2.4rem;line-height:1.1;margin:0 0 20px;text-wrap:balance}
.page p{margin:0 0 1em}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;margin-bottom:24px}
.intro{font-family:var(--display);font-style:italic;font-size:1.08rem;line-height:1.5;color:var(--side-fg);opacity:.88;max-width:30ch;margin:-8px 0 0;text-wrap:pretty}
.lang{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.75rem;letter-spacing:.08em;padding:4px 12px;background:none;border:0;color:var(--side-muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--side-fg);color:var(--side)}
.contact-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.contact-row b{width:110px;font-weight:600}
.contact-row span,.contact-row a{min-width:0;overflow-wrap:anywhere;color:var(--fg)}
.contact-row a{text-decoration-color:var(--accent);text-underline-offset:3px}
.copy{font:inherit;font-size:.8rem;padding:4px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;cursor:pointer}
.note{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:56px;padding-top:12px}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;height:auto;align-items:center;text-align:center;gap:18px;
    padding-block:36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .intro{margin-top:0}
  nav{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:18px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
}
@media (prefers-reduced-motion:no-preference){.card .thumb{transition:transform .25s}.card:hover .thumb{transform:translateY(-3px)}}

.card .thumb img,.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-img{aspect-ratio:16/9;margin-bottom:28px;border-radius:2px;overflow:hidden;background:var(--line)}
/* leespagina */
.lees{max-width:700px}
.lees-kop{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.lees-kop h2{font-size:clamp(2rem,4vw,2.9rem);margin:0}
.lead{font-family:var(--display);font-size:1.3rem;line-height:1.5;color:var(--muted);margin:0;text-wrap:pretty}
.hero-img{margin:0 0 36px}
.article-body{font-family:var(--display);font-size:1.2rem;line-height:1.75;overflow-wrap:break-word}
.article-body>*{margin:0 0 1.1em}
.article-body h2,.article-body h3,.article-body h4{font-family:var(--display);font-weight:600;line-height:1.25;margin:1.8em 0 .6em;text-wrap:balance}
.article-body h2{font-size:1.6rem}.article-body h3{font-size:1.35rem}.article-body h4{font-size:1.15rem}
.article-body a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
.article-body a:hover{color:var(--accent)}
.article-body blockquote{border-left:3px solid var(--accent);padding-left:20px;font-style:italic;color:var(--muted)}
.article-body ul,.article-body ol{padding-left:1.4em}
.article-body li{margin-bottom:.4em}
.article-body img{display:block;width:100%;height:auto;border-radius:2px}
.article-body figcaption{font-family:var(--body);font-size:.85rem;color:var(--muted);margin-top:8px}
.article-body hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.lees-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.lees-top .back{margin:0}
.art-lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.art-lang button{font:inherit;font-size:.82rem;padding:6px 14px;background:none;border:0;color:var(--muted);cursor:pointer}
.art-lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lees-voet{border-top:1px solid var(--line);margin-top:48px;padding-top:20px}
.btn{display:inline-block;padding:10px 18px;background:var(--accent);color:#fff;text-decoration:none;border-radius:4px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <aside id="side">
    <img class="photo" id="foto" alt="Diana Saoutieva" src="">
    <h1 class="name">Diana Saoutieva</h1>
    <p class="intro" id="intro"></p>
    <nav>
      <a href="#home" data-t="navHome">Artikelen</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="lang" role="group" aria-label="Taal / Language">
      <button data-lang="nl">NL</button><button data-lang="en">EN</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script src="site.js"></script>
</body>
</html>
